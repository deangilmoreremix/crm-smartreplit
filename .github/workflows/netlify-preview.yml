name: Netlify Preview

# Deploys a draft preview with the Netlify CLI and comments the URL on the PR.
# Requires repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID; without
# them the job is skipped. Fork PRs never receive secrets, so they are skipped too.
# Runtime env vars (Supabase, OpenAI) come from the Netlify site settings.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Check for Netlify secrets
        id: gate
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Netlify secrets not available; skipping preview deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        if: steps.gate.outputs.enabled == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Deploy preview
        if: steps.gate.outputs.enabled == 'true'
        id: deploy
        run: |
          npx netlify-cli deploy --build --alias "pr-${{ github.event.number }}" --json > deploy.json
          echo "url=$(node -p "JSON.parse(require('fs').readFileSync('deploy.json','utf8')).deploy_url")" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- netlify-preview -->';
            const body = `${marker}\nNetlify preview: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
