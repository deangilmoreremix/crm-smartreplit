name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Dummy public values so the Vite build never needs real secrets.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Type-check ratchet (server)
        run: node scripts/typecheck-ratchet.mjs --target server

      - name: Type-check ratchet (client)
        run: node scripts/typecheck-ratchet.mjs --target client

      # Hard gate: server + workspace packages are fully green.
      - name: Unit tests (server, packages)
        run: npx vitest run server packages

      - name: Unit tests (client)
        run: npx vitest run client/src

      - name: Build (client + Netlify functions)
        run: npm run build

  # Real-browser smoke of the built client (no secrets, no backend: Supabase and /api are stubbed
  # by the tests). Catches crashes, redirects and controls that cannot be clicked.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://dummy.supabase.co
      VITE_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build client
        run: npx vite build --outDir dist-smoke

      - name: Serve the build
        run: |
          npx vite preview --outDir dist-smoke --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Browser smoke
        env:
          LOCAL_BASE_URL: http://127.0.0.1:4173
        run: npm run test:smoke:local

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results
          path: test-results-local
          if-no-files-found: ignore
