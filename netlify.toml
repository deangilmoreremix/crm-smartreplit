[build]
command   = "npm run build"
publish   = "server/public"
functions = "netlify/functions"

[build.environment]
# Vite 7 (^7.3.5) requires Node.js >=20.19.0 or >=22.12.0. A plain "20" pin can
# resolve to an older 20.x build image, which fails at config load with
# "Vite requires Node.js version 20.19+ or 22.12+". Pin to 22 (LTS) so the
# build image always satisfies the toolchain requirement.
NODE_VERSION = "22"
SECRETS_SCAN_ENABLED = "true"
VITE_ENABLE_MFE = "true"

[dev]
command = "npm run dev"
targetPort = 5000
port = 8888

[functions]
node_bundler = "esbuild"

# SPA fallback for client-side routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# API redirects to Netlify Functions
[[redirects]]
from = "/api/openai/smart-greeting"
to = "/.netlify/functions/openai"
status = 200

[[redirects]]
from = "/api/openai/kpi-analysis"
to = "/.netlify/functions/openai"
status = 200

[[redirects]]
from = "/api/openai/business-intelligence"
to = "/.netlify/functions/openai"
status = 200