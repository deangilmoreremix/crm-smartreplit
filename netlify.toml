[build]
command   = "npm run build"
publish   = "server/public"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"
SECRETS_SCAN_ENABLED = "true"
VITE_ENABLE_MFE = "true"

[dev]
command = "npm run dev"
targetPort = 5000
port = 8888

[functions]
node_bundler = "esbuild"

# Express API (server/netlify-api.ts) — must come before the SPA fallback,
# because Netlify applies the first matching rule
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

# SPA fallback for client-side routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
