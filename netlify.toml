[build]
command   = "npm run build"
publish   = "server/public"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"
SECRETS_SCAN_ENABLED = "true"
VITE_ENABLE_MFE = "true"

[dev]
command = "npm run dev"
targetPort = 5000
port = 8888

[functions]
node_bundler = "esbuild"

# All /api/* requests run the Express API as one Netlify Function (server/netlify-api.ts).
# Must come BEFORE the SPA fallback: Netlify applies the first matching rule.
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

# SPA fallback for client-side routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200